{% extends "base.html" %}
{% block title %}ورود — onedo wordpress{% endblock %}
{% block auth %}
<div class="login-page">
  <form class="login-box" method="post" action="{{ url_for('login', next=next_url) }}">
    <h1>onedo wordpress</h1>
    {% if error %}
    <div class="alert err">{{ error }}</div>
    {% endif %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">نام کاربری</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">رمز عبور</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">ورود</button>
  </form>
  <p class="panel-footer login-credit">ساخته شده توسط <a href="https://onedo.ir" target="_blank" rel="noopener noreferrer">onedo.ir</a></p>
</div>
{% endblock %}
