<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}پنل مدیریت{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
</head>
<body>
  {% if logged_in %}
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="{{ url_for('dashboard') }}">پنل مدیریت</a>
      <div class="nav-links">
        <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">خانه</a>
        <a href="{{ url_for('configs') }}" class="{% if request.endpoint == 'configs' %}active{% endif %}">تنظیمات فایل‌ها</a>
        <a href="{{ url_for('shell') }}" class="{% if request.endpoint == 'shell' %}active{% endif %}">شل</a>
        <span class="muted">{{ panel_user }}</span>
        <a href="{{ url_for('logout') }}">خروج</a>
      </div>
    </nav>
    {% block body %}{% endblock %}
  </div>
  {% else %}
    {% block auth %}{% endblock %}
  {% endif %}
</body>
</html>
