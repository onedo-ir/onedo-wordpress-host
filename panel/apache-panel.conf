# Admin panel (Flask/gunicorn on 127.0.0.1:9090)
ProxyPreserveHost On
ProxyRequests Off

<Location /panel>
    # Shell + backup create/restore can take several minutes
    # (ProxyTimeout is not allowed in <Location>; use ProxyPass timeout=)
    ProxyPass http://127.0.0.1:9090/panel timeout=900
    ProxyPassReverse http://127.0.0.1:9090/panel
    Require all granted
</Location>
