services:
  wordpress:
    image: gitea.tmayt.ir/thaiostream/wp
    container_name: ${CONTAINER_NAME:-wp}
    build: .
    ports:
      - "${PORT_HTTP:-80}:80"
    env_file:
      - .env
    volumes:
      - wp_html:/var/www/html
      - wp_db:/var/lib/mysql
      - filebrowser_db:/database
      - filebrowser_cfg:/config
      - apache2_data:/etc/php/8.1/apache2
    restart: always
    # Soft caps for a typical small VPS; raise if the site grows
    mem_limit: 1536m
    cpus: 2.0

volumes:
  wp_html:
  wp_db:
  filebrowser_db:
  filebrowser_cfg:
  apache2_data:
