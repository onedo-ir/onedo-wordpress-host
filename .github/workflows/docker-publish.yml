# Build the WordPress stack image and replace the published :latest tag.
# Runs only when a push to main includes the word "build" in the commit message,
# or when triggered manually (workflow_dispatch).
# Tuned for Gitea container registry (rejects buildx attestation / OCI index).
#
# Required repository secrets:
#   REGISTRY_USERNAME  — registry / Gitea user
#   REGISTRY_PASSWORD  — password or access token with package write

name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: gitea.tmayt.ir
  IMAGE_NAME: gitea.tmayt.ir/thaiostream/wp
  # Prevent BuildKit from attaching attestation manifests (Gitea → "unknown")
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  build-and-push:
    # Skip ordinary pushes; only build when commit message contains "build"
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(toLower(github.event.head_commit.message), 'build')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Classic docker driver = plain image manifest (no OCI index / attestations)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
