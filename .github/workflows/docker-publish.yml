# Build the WordPress stack image and replace the published :latest tag.
# Works on GitHub Actions and Gitea Actions (same workflow syntax).
#
# Required repository secrets:
#   REGISTRY_USERNAME  — registry / Gitea user
#   REGISTRY_PASSWORD  — password or access token with package write

name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: gitea.tmayt.ir
  IMAGE_NAME: gitea.tmayt.ir/thaiostream/wp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
