# Build the WordPress stack image and replace the published :latest tag.
# Runs on every push to main, or when triggered manually (workflow_dispatch).
# Image version tag = sanitized commit subject (not the SHA hex).
# Tuned for Gitea container registry (rejects buildx attestation / OCI index).
#
# Required repository secrets (job is skipped — not failed — if either is unset):
#   REGISTRY_USERNAME  — registry / Gitea user
#   REGISTRY_PASSWORD  — password or access token with package write

name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: gitea.tmayt.ir
  IMAGE_NAME: gitea.tmayt.ir/thaiostream/wp
  # Prevent BuildKit from attaching attestation manifests (Gitea → "unknown")
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Empty / missing secrets → skip the whole job (success/neutral, no error)
    if: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Classic docker driver = plain image manifest (no OCI index / attestations)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Docker tags cannot use spaces / Persian / most punctuation — slugify subject.
      # Fallback: short SHA only if the subject sanitizes to empty.
      - name: Version from commit subject
        id: meta
        run: |
          set -euo pipefail
          SUBJECT=$(git log -1 --pretty=%s)
          VERSION=$(printf '%s' "$SUBJECT" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-.]+//; s/[-.]+$//; s/-+/-/g' \
            | cut -c1-120)
          if [ -z "$VERSION" ] || [ "$VERSION" = "." ] || [ "$VERSION" = ".." ]; then
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Commit subject : ${SUBJECT}"
          echo "Image version  : ${VERSION}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
