[supervisord]
nodaemon=true

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true

[program:mariadb]
command=/usr/sbin/mysqld
autostart=true
autorestart=true

[program:filebrowser]
command=/usr/local/bin/filebrowser -a 0.0.0.0 -p 8080
autostart=true
autorestart=true

[program:init]
command=/bin/bash /init.sh
autostart=true
autorestart=false