# Keep Apache accept capacity close to PHP-FPM capacity.
# Previously MaxRequestWorkers=100 with only ~12 FPM children let Apache
# pile up waiting PHP handoffs and inflate RAM/CPU under load.
<IfModule mpm_event_module>
    ServerLimit 2
    StartServers 1
    MinSpareThreads 4
    MaxSpareThreads 16
    ThreadLimit 64
    ThreadsPerChild 25
    MaxRequestWorkers 40
    MaxConnectionsPerChild 1000
</IfModule>
