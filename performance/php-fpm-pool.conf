; Override default www pool — ondemand keeps idle RAM low.
; Caps + spawn rate stop php-fpm from stampeding under traffic spikes.
[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; Small backlog: when full, Apache gets an immediate error instead of
; queuing hundreds of stuck PHP handoffs (RAM/CPU climb).
listen.backlog = 64

pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 10s
pm.max_requests = 500
; Limit how fast new workers appear during a spike
pm.max_spawn_rate = 8

request_terminate_timeout = 60
request_slowlog_timeout = 15s
slowlog = /var/log/php-fpm-slow.log
catch_workers_output = yes
clear_env = no
security.limit_extensions = .php
; Keep upload temp on a www-data-writable path (see init / php-fpm-start)
php_admin_value[upload_tmp_dir] = /tmp/php-uploads
