; Shared PHP runtime tuning (FPM + CLI)
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
post_max_size = 256M
upload_max_filesize = 256M
max_input_vars = 3000
; Must be writable by www-data — WordPress moves from here into wp-content/uploads
upload_tmp_dir = /tmp/php-uploads

realpath_cache_size = 4096K
realpath_cache_ttl = 600

expose_php = Off
allow_url_fopen = On
session.lazy_write = On
