# Block common WordPress load / abuse patterns that burn php-fpm:pool www.

# Slowloris / stalled clients holding workers
<IfModule mod_reqtimeout.c>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# Cap upload body (align with PHP post_max_size)
LimitRequestBody 67108864

# xmlrpc.php — brute-force & amplification target; heavy PHP per hit
<Files "xmlrpc.php">
    Require all denied
</Files>

# wp-cron.php — only local (supervisor / loopback). Stops external cron floods.
<Files "wp-cron.php">
    Require local
</Files>

# Sensitive / leftover files must never hit PHP
<FilesMatch "(?i)^(wp-config\.php|readme\.html|license\.txt)$">
    Require all denied
</FilesMatch>
<FilesMatch "(?i)\.(bak|old|orig|save|swp|sql)$">
    Require all denied
</FilesMatch>

# Login / cron / xmlrpc: drop odd HTTP methods early
<LocationMatch "^/(wp-login\.php|wp-cron\.php|xmlrpc\.php)$">
    <LimitExcept GET POST HEAD>
        Require all denied
    </LimitExcept>
</LocationMatch>
