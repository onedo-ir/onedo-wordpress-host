# Route PHP to FPM (socket created by our pool override).
# ProxyTimeout matches request_terminate_timeout so Apache does not hold
# threads longer than FPM will run a script.
<IfModule mod_proxy_fcgi.c>
    ProxyTimeout 60
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>
    DirectoryIndex index.php index.html
</IfModule>
